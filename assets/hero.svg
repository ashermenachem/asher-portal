<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Asher Portal</title>
  <description id="description">A cinematic mockup of Asher Portal showing a live webpage above a real terminal.</description>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.48" stop-color="#0b0f18"/>
      <stop offset="1" stop-color="#12091c"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientTransform="translate(300 180) rotate(35) scale(720 520)">
      <stop offset="0" stop-color="#2d7dff" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#2d7dff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientTransform="translate(1320 160) rotate(145) scale(620 500)">
      <stop offset="0" stop-color="#a24dff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a24dff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="portalLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f80ff"/>
      <stop offset="0.48" stop-color="#56d6ff"/>
      <stop offset="1" stop-color="#b35cff"/>
    </linearGradient>

    <linearGradient id="webSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101726"/>
      <stop offset="1" stop-color="#10111b"/>
    </linearGradient>

    <linearGradient id="cardSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset="1" stop-color="#111624"/>
    </linearGradient>

    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.72"/>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <clipPath id="windowClip">
      <rect x="120" y="110" width="1360" height="680" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glowLeft)"/>
  <rect width="1600" height="900" fill="url(#glowRight)"/>

  <g opacity="0.22">
    <path d="M0 820 C320 760 480 880 800 810 C1120 740 1320 840 1600 760" fill="none" stroke="#4d74ff" stroke-width="1"/>
    <path d="M0 850 C310 790 500 900 820 830 C1140 760 1330 870 1600 790" fill="none" stroke="#a852ff" stroke-width="1"/>
  </g>

  <text x="120" y="72" fill="#f5f7ff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="750" letter-spacing="8">ASHER PORTAL</text>
  <text x="1480" y="72" text-anchor="end" fill="#8f9bb3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" letter-spacing="2">THE WEB, INSIDE YOUR TERMINAL</text>

  <g filter="url(#windowShadow)">
    <rect x="120" y="110" width="1360" height="680" rx="30" fill="#090b11" stroke="#30384d" stroke-width="2"/>
  </g>

  <g clip-path="url(#windowClip)">
    <rect x="120" y="110" width="1360" height="62" fill="#121722"/>
    <circle cx="158" cy="141" r="8" fill="#ff5f57"/>
    <circle cx="184" cy="141" r="8" fill="#febc2e"/>
    <circle cx="210" cy="141" r="8" fill="#28c840"/>

    <text x="800" y="148" text-anchor="middle" fill="#e7ebf4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="650">Asher Portal</text>

    <rect x="120" y="172" width="1360" height="414" fill="url(#webSurface)"/>

    <rect x="170" y="206" width="1260" height="44" rx="12" fill="#0b0f18" stroke="#293249"/>
    <circle cx="199" cy="228" r="6" fill="#54d9ff"/>
    <text x="221" y="235" fill="#cbd4e8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">https://github.com/ashermenachem/asher-portal</text>
    <rect x="1334" y="218" width="70" height="20" rx="10" fill="#1d2d48"/>
    <text x="1369" y="233" text-anchor="middle" fill="#6fdcff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">LIVE</text>

    <rect x="170" y="280" width="1260" height="266" rx="22" fill="url(#cardSurface)" stroke="#28344d"/>
    <rect x="214" y="326" width="84" height="84" rx="22" fill="#0c111c" stroke="#34425f"/>
    <path d="M248 350 L280 368 L248 386 Z" fill="none" stroke="url(#portalLine)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M236 394 H280" stroke="#52617a" stroke-width="5" stroke-linecap="round"/>

    <text x="330" y="346" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="31" font-weight="800">ashermenachem / asher-portal</text>
    <text x="330" y="382" fill="#9aa8c1" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="19">A real terminal with live webpages built directly into the same window.</text>

    <g transform="translate(330 416)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#152b22" stroke="#285c46"/>
      <circle cx="20" cy="17" r="5" fill="#38d996"/>
      <text x="34" y="23" fill="#8ef0c3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">v1.0.1</text>

      <rect x="132" y="0" width="160" height="34" rx="17" fill="#151f32" stroke="#2c456d"/>
      <text x="212" y="23" text-anchor="middle" fill="#7fc8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">APPLE SILICON</text>

      <rect x="306" y="0" width="92" height="34" rx="17" fill="#21172d" stroke="#5b3273"/>
      <text x="352" y="23" text-anchor="middle" fill="#d9a0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">INTEL</text>
    </g>

    <rect x="120" y="584" width="1360" height="3" fill="url(#portalLine)"/>
    <rect x="120" y="587" width="1360" height="203" fill="#090b10"/>

    <text x="170" y="632" fill="#68758d" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">REAL ZSH SESSION</text>

    <text x="170" y="675" fill="#76e4a4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">asher@Mac ~ %</text>
    <text x="344" y="675" fill="#f0f3fa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">github.com</text>
    <text x="1350" y="675" text-anchor="end" fill="#5fc8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">OPENED ABOVE ↑</text>

    <text x="170" y="718" fill="#76e4a4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">asher@Mac ~ %</text>
    <text x="344" y="718" fill="#f0f3fa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">youtube.com</text>
    <text x="1350" y="718" text-anchor="end" fill="#b486ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">SAME PANE. NEW SITE.</text>

    <text x="170" y="761" fill="#76e4a4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">asher@Mac ~ %</text>
    <text x="344" y="761" fill="#f0f3fa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">instagram.com/ashermenachem</text>
    <rect x="698" y="744" width="12" height="22" rx="2" fill="#ffffff"/>
  </g>

  <rect x="228" y="820" width="1144" height="1" fill="url(#portalLine)" opacity="0.8"/>
  <text x="800" y="858" text-anchor="middle" fill="#c5ccda" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="650" letter-spacing="1">TYPE A URL LIKE A COMMAND. KEEP THE TERMINAL. OPEN THE PORTAL.</text>
</svg>
