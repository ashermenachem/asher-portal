<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
  <title id="title">Asher Portal 1.1</title>
  <description id="description">The redesigned Asher Portal interface with browser tabs, an address and search bar, a live webpage, and a persistent terminal.</description>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070c"/>
      <stop offset="0.52" stop-color="#090e17"/>
      <stop offset="1" stop-color="#0d0716"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(280 210) rotate(35) scale(820 620)">
      <stop offset="0" stop-color="#2478ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2478ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1510 180) rotate(145) scale(720 580)">
      <stop offset="0" stop-color="#9147ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#9147ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".52" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#9b6cff"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>

    <linearGradient id="activeTab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c293e"/>
      <stop offset="1" stop-color="#111a29"/>
    </linearGradient>

    <linearGradient id="pageCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243a"/>
      <stop offset="1" stop-color="#101725"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="42" flood-color="#000" flood-opacity=".72"/>
    </filter>

    <clipPath id="windowClip">
      <rect x="120" y="105" width="1560" height="785" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1800" height="1000" fill="url(#bg)"/>
  <rect width="1800" height="1000" fill="url(#blueGlow)"/>
  <rect width="1800" height="1000" fill="url(#violetGlow)"/>

  <g opacity=".05" stroke="#d6e2ff">
    <path d="M0 110H1800M0 190H1800M0 270H1800M0 350H1800M0 430H1800M0 510H1800M0 590H1800M0 670H1800M0 750H1800M0 830H1800M0 910H1800"/>
    <path d="M80 0V1000M160 0V1000M240 0V1000M320 0V1000M400 0V1000M480 0V1000M560 0V1000M640 0V1000M720 0V1000M800 0V1000M880 0V1000M960 0V1000M1040 0V1000M1120 0V1000M1200 0V1000M1280 0V1000M1360 0V1000M1440 0V1000M1520 0V1000M1600 0V1000M1680 0V1000"/>
  </g>

  <text x="120" y="70" fill="#f4f7fc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="29" font-weight="800" letter-spacing="7">ASHER PORTAL</text>
  <text x="1680" y="70" text-anchor="end" fill="#77859c" font-family="SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">SEARCH • TABS • TERMINAL • WEB</text>

  <g filter="url(#shadow)">
    <rect x="120" y="105" width="1560" height="785" rx="28" fill="#070a10" stroke="#303a50" stroke-width="2"/>
  </g>

  <g clip-path="url(#windowClip)">
    <rect x="120" y="105" width="1560" height="82" fill="url(#chrome)"/>

    <circle cx="154" cy="138" r="8" fill="#ff5f57"/>
    <circle cx="181" cy="138" r="8" fill="#febc2e"/>
    <circle cx="208" cy="138" r="8" fill="#28c840"/>

    <rect x="242" y="119" width="36" height="36" rx="10" fill="#0b111b" stroke="#30405b"/>
    <path d="M254 128.5 269 137 254 145.5Z" fill="none" stroke="url(#accent)" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M252 149h18" stroke="#72819a" stroke-width="2.2" stroke-linecap="round"/>

    <text x="291" y="136" fill="#f1f5fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="14" font-weight="750">Asher Portal</text>
    <text x="291" y="151" fill="#637088" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="8" font-weight="800" letter-spacing="2">TERMINAL × WEB</text>

    <g transform="translate(520 122)" fill="none" stroke="#78879f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m13 4-7 7 7 7"/>
      <path d="m43 4 7 7-7 7"/>
      <path d="M82 7V3l-3 3a9 9 0 1 0 3 8"/>
    </g>

    <rect x="625" y="119" width="670" height="41" rx="13" fill="#111927" stroke="#324158"/>
    <path d="M650 139a6 6 0 0 0 8.5.1l2.3-2.3a6 6 0 0 0-8.5-8.5l-1.2 1.2" fill="none" stroke="#6b7b94" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M656 137a6 6 0 0 0-8.5-.1l-2.3 2.3a6 6 0 0 0 8.5 8.5l1.2-1.2" fill="none" stroke="#6b7b94" stroke-width="1.8" stroke-linecap="round"/>
    <text x="680" y="145" fill="#dce5f2" font-family="SFMono-Regular,Menlo,monospace" font-size="14">Search the web or enter a URL</text>
    <rect x="1218" y="127" width="60" height="24" rx="12" fill="#10251f" stroke="#275746"/>
    <circle cx="1234" cy="139" r="4" fill="#42d9a0"/>
    <text x="1246" y="143" fill="#72e9ba" font-family="SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">LIVE</text>

    <g transform="translate(1328 122)" fill="none" stroke="#8493aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 5h5v5M13 5 4 14M11 13v5H2V9h5"/>
      <path d="M39 4h-5v5M47 4h5v5M39 20h-5v-5M47 20h5v-5"/>
      <path d="m77 6 12 12M89 6 77 18"/>
    </g>

    <rect x="120" y="187" width="1560" height="46" fill="#090e16"/>
    <rect x="210" y="193" width="275" height="34" rx="10" fill="url(#activeTab)" stroke="#34445f"/>
    <circle cx="230" cy="210" r="5" fill="#42d9a0"/>
