    <path d="m462 205 10 10m0-10-10 10" stroke="#6d7c93" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="229" y="225" width="237" height="2" rx="1" fill="url(#accent)"/>

    <rect x="492" y="193" width="245" height="34" rx="10" fill="#101722" stroke="#202c3e"/>
    <circle cx="512" cy="210" r="5" fill="#506078"/>
    <text x="526" y="215" fill="#8796ac" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="620">GitHub</text>
    <path d="m714 205 10 10m0-10-10 10" stroke="#5f6d82" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="744" y="193" width="245" height="34" rx="10" fill="#101722" stroke="#202c3e"/>
    <circle cx="764" cy="210" r="5" fill="#506078"/>
    <text x="778" y="215" fill="#8796ac" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="620">YouTube</text>
    <path d="m966 205 10 10m0-10-10 10" stroke="#5f6d82" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="997" y="195" width="30" height="30" rx="9" fill="#0e1520"/>
    <path d="M1012 202v16M1004 210h16" stroke="#8291a7" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="138" y="249" width="1524" height="395" rx="18" fill="#0d131e" stroke="#2b3850"/>
    <rect x="160" y="270" width="1480" height="352" rx="15" fill="url(#pageCard)"/>

    <text x="205" y="324" fill="#ffffff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="35" font-weight="800">Search results for “golden retriever training”</text>
    <text x="205" y="355" fill="#9aa8be" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="16">Live results opened directly from the address bar or terminal.</text>

    <g transform="translate(205 390)">
      <rect width="860" height="84" rx="16" fill="#111b2b" stroke="#2b3d5a"/>
      <circle cx="31" cy="31" r="18" fill="#172c3f"/>
      <path d="M24 31h14M31 24v14" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="30" fill="#7ec8ff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="13">example.com › training</text>
      <text x="66" y="55" fill="#f1f5fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="19" font-weight="700">A practical guide to training a golden retriever</text>

      <rect y="100" width="860" height="84" rx="16" fill="#111b2b" stroke="#2b3d5a"/>
      <circle cx="31" cy="131" r="18" fill="#201b37"/>
      <path d="M24 131h14M31 124v14" stroke="#b58aff" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="130" fill="#bfa4ff" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="13">dogs.example › basics</text>
      <text x="66" y="155" fill="#f1f5fb" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="19" font-weight="700">The first five commands every dog should learn</text>
    </g>

    <g transform="translate(1132 390)">
      <rect width="430" height="184" rx="20" fill="#111926" stroke="#2b3a52"/>
      <text x="28" y="38" fill="#7587a4" font-family="SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" letter-spacing="1.6">ACTIVE PORTAL</text>
      <text x="28" y="75" fill="#eef3fa" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="23" font-weight="760">Search + Tabs</text>
      <text x="28" y="108" fill="#9ba9be" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="14">Each tab preserves its page, history,</text>
      <text x="28" y="132" fill="#9ba9be" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="14">and scroll position while the shell</text>
      <text x="28" y="156" fill="#9ba9be" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="14">continues running underneath.</text>
    </g>

    <rect x="138" y="658" width="1524" height="214" rx="18" fill="#080b11" stroke="#27344a"/>
    <rect x="138" y="658" width="1524" height="48" rx="18" fill="#111925"/>
    <path d="M138 688h1524" stroke="#1f2a3c"/>
    <rect x="158" y="671" width="28" height="28" rx="8" fill="#101b2b" stroke="#2e405d"/>
    <path d="m166 678 5 5-5 5M174 690h7" fill="none" stroke="#86a7d9" stroke-width="1.8" stroke-linecap="round"/>
    <text x="198" y="683" fill="#dfe7f3" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="700">Terminal</text>
    <text x="198" y="696" fill="#5b6a81" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="8" font-weight="800" letter-spacing="1.7">REAL ZSH SESSION</text>
    <circle cx="1564" cy="682" r="5" fill="#42d9a0"/>
    <text x="1577" y="686" fill="#708099" font-family="SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.2">SHELL READY</text>

    <text x="170" y="750" fill="#55d99f" font-family="SFMono-Regular,Menlo,monospace" font-size="17">asher@Mac ~ %</text>
    <text x="332" y="750" fill="#ecf2fa" font-family="SFMono-Regular,Menlo,monospace" font-size="17">golden retriever training</text>
    <text x="1545" y="750" text-anchor="end" fill="#6fe6f5" font-family="SFMono-Regular,Menlo,monospace" font-size="12">SEARCHED IN ACTIVE TAB ↑</text>

    <text x="170" y="790" fill="#55d99f" font-family="SFMono-Regular,Menlo,monospace" font-size="17">asher@Mac ~ %</text>
    <text x="332" y="790" fill="#ecf2fa" font-family="SFMono-Regular,Menlo,monospace" font-size="17">pwd</text>
    <text x="170" y="822" fill="#9aa8be" font-family="SFMono-Regular,Menlo,monospace" font-size="15">/Users/ashermenachem</text>

    <text x="170" y="852" fill="#55d99f" font-family="SFMono-Regular,Menlo,monospace" font-size="17">asher@Mac ~ %</text>
    <rect x="332" y="835" width="12" height="22" rx="2" fill="#70e7f7"/>
  </g>

  <text x="900" y="948" text-anchor="middle" fill="#c8d2e1" font-family="Inter,ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="22" font-weight="680" letter-spacing="1">ONE WINDOW. REAL TABS. LIVE WEB. REAL TERMINAL.</text>
</svg>
