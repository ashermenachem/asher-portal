name: Build and release Asher Portal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release archive
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder \
            --mac zip \
            --${{ matrix.arch }} \
            --publish never

      - name: Verify and checksum archive
        run: |
          cd dist
          ASSET="Asher-Portal-macOS-${{ matrix.arch }}.zip"
          test -f "$ASSET"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: asher-portal-${{ matrix.arch }}
          path: |
            dist/Asher-Portal-macOS-${{ matrix.arch }}.zip
            dist/Asher-Portal-macOS-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: asher-portal-*
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: ls -lh release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Asher Portal $GITHUB_REF_NAME" \
              --generate-notes
          fi
