<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Asher Portal</title>

  <link
    rel="stylesheet"
    href="./node_modules/@xterm/xterm/css/xterm.css"
  >

  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>
  <main id="terminal-panel">
    <header id="preview-status">
      <div id="preview-status-text">
        Live webpage
      </div>

      <div id="preview-actions">
        <button
          id="expand-preview-button"
          class="preview-action-button"
          type="button"
          title="Expand webpage"
          aria-label="Expand webpage"
        >
          ⤢
        </button>

        <button
          id="close-preview-button"
          class="preview-action-button"
          type="button"
          title="Close webpage"
          aria-label="Close webpage"
        >
          ×
        </button>
      </div>
    </header>

    <section id="terminal-container">
      <div id="terminal"></div>
    </section>
  </main>

  <script src="./node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="./node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
